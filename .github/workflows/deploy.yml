name: Deploy to Server via FTP

on:
  push:
    branches:
      - develop
    paths:
      - '**/*.php'                      # Deploy jika ada edit di file berekstensi .php di folder manapun
      - '.github/workflows/deploy.yml'  # Deploy jika file workflow ini diedit
      - 'composer.json'                 # Deploy jika ada perubahan dependensi/library
      - 'composer.lock'                 # Deploy jika ada pembaruan versi dependensi

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install Dependencies (Composer)
        run: composer install --no-dev --optimize-autoloader

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Sesuaikan dengan path folder subdomain Anda di cPanel
          server-dir: ${{ secrets.ROOT_FOLDER }}
          # Mencegah folder/file yang tidak perlu ikut terupload ke server
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/docs*/**
            **/tests*/**
            .editorconfig
            .gitattributes
            .gitignore
            LICENSE
            README.md
            package.json
            phpunit.xml
            vite.config.js
